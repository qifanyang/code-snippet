<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Demo</title>
</head>
<body>
<a href="skip.html">skip</a>
<a href="http://jquery.com/">jQuery</a>
<script src="jquery-3.2.1.js"></script>
<script>

    $( document ).ready(function() {

        console.log("document finish loading....");
        //加载jQuery时,执行立即执行函数,开始jQuery的初始化
        //最后将jQuery设置为window的一个属性,成为全局变量

        //每打开一个网页,都会有自己对应的window对象,加载jQuery然后执行立即函数,完成jQuery的初始化

        //jQuery 工厂方法分析
        /*
        1.定义jQuery函数,该函数没有执行,执行$()方法其实是执行jQuery.fn.init( selector, context )
         // Define a local copy of jQuery
         jQuery = function( selector, context ) {

         // The jQuery object is actually just the init constructor 'enhanced'
         // Need init if jQuery is called (just allow error to be thrown if not included)
         return new jQuery.fn.init( selector, context );
         },

         2.在jQuery函数原型上添加属性和方法,并将原型赋值给jQuery.fn=jQuery.prototype, 所以fn就是jQuery原型对象
         jQuery.fn = jQuery.prototype = {

         // The current version of jQuery being used
         jquery: version,

         constructor: jQuery,

         // The default length of a jQuery object is 0
         length: 0,

         toArray: function() {
         return slice.call( this );
         },
         ...
         }

         3.为jQuery.fn增加extend方法,通过该方法可以为jQuery对象增加属性或者方法
         jQuery.fn.extend和jQuery.extend作用的对象不一样(this不一样)
         jQuery.fn.extend扩展原型对象Object,因为extend作为fn属性,也就是原型对象的属性
         jQuery.extend扩展jQuery函数,通过$.eq()可以调用

        4.定义init函数,并让该函数继承jQuery,所以init函数为jQuery的子类
         var init = jQuery.fn.init = function( selector, context, root ) {....}
         init.prototype = jQuery.fn;

        5.初始化rootjQuery,所有的选择器查找都基于document
         // Initialize central reference
         rootjQuery = jQuery( document );//等同于$()创建jQuery对象,执行步骤1的函数

        注意:$()执行  new jQuery.fn.init( selector, context ),
        所以this是构造函数jQuery.fn.init的实例,init有jQuery的方法和属性


         * */

        $("a");
        //$是jQuery的简写,jQuery为一个工厂方法,调用该方法执行return new jQuery.fn.init( selector, context );


        $("a").click(function (event) {
            alert("you are clicking");
        });
    });

</script>
</body>
</html>
